plugins {
    id 'org.jetbrains.kotlin.jvm' version '1.9.22'
}
repositories { mavenCentral() }
dependencies {
    // Infrastruttura del corso per compilare il Kotlin generato.
    implementation files('libs/unibo.qakactor23-5.0.jar', 'libs/unibo.basicomm23-1.0.jar', 'libs/2p301.jar', 'libs/uniboInterfaces.jar')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core-jvm:1.7.3'
    implementation 'org.eclipse.californium:californium-core:3.5.0'
    implementation 'org.eclipse.californium:californium-proxy2:3.5.0'
    implementation 'org.eclipse.paho:org.eclipse.paho.client.mqttv3:1.2.5'
    implementation 'com.googlecode.json-simple:json-simple:1.1.1'
    implementation 'org.json:json:20180130'
    implementation 'ch.qos.logback:logback-classic:1.2.11'
    testImplementation 'junit:junit:4.13.2'
}
java { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }
sourceSets.main.kotlin.srcDir('src/it')

tasks.register('prepareLaunch') {
    group = 'application'
    description = 'Compila una volta e prepara il classpath per gli avvii diretti Java.'
    dependsOn tasks.named('classes')
    doLast {
        def output = layout.buildDirectory.file('launch-classpath.txt').get().asFile
        output.parentFile.mkdirs()
        output.setText(sourceSets.main.runtimeClasspath.asPath, 'UTF-8')
    }
}

// Le proprieta -Pcargo.* vengono inoltrate ai processi JVM dei contesti.
def configureCargo = { JavaExec task ->
    task.group = 'application'
    task.dependsOn tasks.named('classes')
    task.classpath = sourceSets.main.runtimeClasspath
    task.workingDir = projectDir
    project.properties.findAll { key, value -> key.startsWith('cargo.') }.each { key, value ->
        task.systemProperty key, value.toString()
    }
}
[
    runCtxCargoService: 'ctxcargoservice', runCtxCargoRobot: 'ctxcargorobot',
    runCtxIoPort: 'ctxioport', runCtxSensor: 'ctxsensor'
].each { taskName, contextName ->
    tasks.register(taskName, JavaExec) {
        configureCargo(delegate)
        description = "Avvia ${contextName} in un processo indipendente."
        mainClass.set('it.unibo.cargo.MainContextKt')
        args contextName
    }
}
tasks.register('simulateSonar', JavaExec) {
    configureCargo(delegate)
    mainClass.set('it.unibo.cargo.tools.SonarSimulator')
    args System.getProperty('sonar.sequence', '100:1000,40:4000,100:1000')
}
tasks.register('generateQak', Exec) {
    group = 'build'
    description = 'Rigenera gli attori Sprint1 con il generatore QAK UniBo.'
    commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', 'scripts/generate-qak.ps1'
}
test { useJUnit(); testLogging { events 'passed', 'failed', 'skipped' } }
test {
    // I test TCP avviano e arrestano i propri quattro processi (nessun Docker richiesto).
    systemProperty 'cargo.testClasspath', sourceSets.main.runtimeClasspath.asPath
    systemProperty 'cargo.projectDir', projectDir.absolutePath
    systemProperty 'cargo.externalTests', project.findProperty('cargo.externalTests') ?: 'false'
    systemProperty 'cargo.testPortOffset', project.findProperty('cargo.externalTests') == 'true' ? '0' : '10000'
    maxParallelForks = 1
}
// Preferire JUnit esplicito alla vecchia versione incorporata nel jar tuProlog.
tasks.named('compileTestJava') {
    classpath = files(configurations.testCompileClasspath.filter { it.name.startsWith('junit-') }) + classpath
}
tasks.named('test') {
    classpath = files(configurations.testRuntimeClasspath.filter { it.name.startsWith('junit-') }) + classpath
}
